services:
  - type: web
    name: revora-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Free web services do not support preDeployCommand.
    startCommand: npm run migrate:schema && npm run migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revora-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: REDIS_URL
        # Upstash Redis TLS connection URL. Keep eviction disabled for BullMQ.
        # Set this secret in Render; never commit database credentials.
        sync: false
      # Reduce idle BullMQ commands to fit Upstash's free monthly command quota.
      - key: QUEUE_DRAIN_DELAY_SECONDS
        value: "60"
      - key: QUEUE_STALLED_INTERVAL_MS
        value: "300000"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://whatsapp-order-os.vercel.app
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: MESSAGING_PROVIDER
        value: whatsapp
      - key: WEBHOOK_SKIP_SIGNATURE_VERIFY
        value: "false"
      - key: WEBHOOK_ALLOW_SIMULATE_WITHOUT_SIGNATURE
        value: "false"
      - key: WHATSAPP_TOKEN
        value: PLACEHOLDER_NOT_REAL_META_TOKEN
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: PLACEHOLDER_NOT_REAL_META_PHONE_NUMBER_ID
      - key: WEBHOOK_VERIFY_TOKEN
        value: PLACEHOLDER_NOT_REAL_WEBHOOK_VERIFY_TOKEN
      - key: WEBHOOK_APP_SECRET
        value: PLACEHOLDER_NOT_REAL_META_APP_SECRET
      - key: ALLOW_TEST_SIMULATE_API
        value: "false"
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

databases:
  - name: revora-postgres
    databaseName: revora
    plan: free
